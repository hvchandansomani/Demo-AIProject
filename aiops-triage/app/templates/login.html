<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | AIOps Triage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login { width: 100%; max-width: 380px; }
    .login .brand { margin-bottom: 22px; }
    .login label { display: block; font-size: 14px; font-weight: 500; margin: 14px 0 6px; }
    .login input {
      width: 100%; padding: 10px 12px; font: 15px var(--mono);
      border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper);
    }
    .login input:focus { outline: none; border-color: var(--info); background: #fff; box-shadow: 0 0 0 3px var(--info-bg); }
    .login .btn-primary { margin-top: 16px; }
    .login .form-error { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <main class="panel login">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M6 17h5l3-8 4 14 3-6h5"/></svg>
        <div>
          <h1>AIOps Triage</h1>
          <p class="brand-sub">Instructor console</p>
        </div>
      </div>
      <form method="post" action="{{ url_for('main.login') }}">
        <label for="token">Admin token</label>
        <input id="token" name="token" type="password" autocomplete="current-password" autofocus required>
        <button class="btn btn-primary" type="submit">Sign in</button>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      </form>
    </main>
  </div>
</body>
</html>
