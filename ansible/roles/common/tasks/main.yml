---
- name: Set a readable hostname
  ansible.builtin.hostname:
    name: "{{ project }}-{{ inventory_hostname }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - jq
      - unzip
      - unattended-upgrades   # security patches install themselves
    state: present
    update_cache: true
    cache_valid_time: 3600
