# Headless Service: gives the StatefulSet pod a stable DNS name ("postgres").
# ClusterIP: None also means it's reachable only inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
